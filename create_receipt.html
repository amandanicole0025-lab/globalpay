<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Receipt | GlobalPay Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#eef3f7;

color:#1f2937;

padding:30px;

min-height:100vh;

}

/* ==========================
CONTAINER
========================== */

.container{

max-width:1450px;

margin:auto;

display:grid;

grid-template-columns:

1.15fr .85fr;

gap:30px;

align-items:start;

}

/* ==========================
CARDS
========================== */

.card{

background:white;

border-radius:22px;

padding:30px;

box-shadow:

0 15px 40px rgba(0,0,0,.08);

}

/* ==========================
HEADER
========================== */

.header{

margin-bottom:28px;

}

.header h1{

font-size:30px;

font-weight:800;

color:#0b7d43;

margin-bottom:8px;

}

.header span{

color:#6b7280;

font-size:15px;

}

/* ==========================
GRID
========================== */

.grid{

display:grid;

grid-template-columns:

repeat(2,minmax(0,1fr));

gap:22px;

}

.full{

grid-column:1/-1;

}

/* ==========================
LABEL
========================== */

label{

display:block;

margin-bottom:8px;

font-weight:700;

font-size:14px;

color:#374151;

}

/* ==========================
INPUTS
========================== */

input,
select,
textarea{

width:100%;

padding:15px;

border:1px solid #d1d5db;

border-radius:12px;

font-size:15px;

transition:.25s;

background:white;

}

input:focus,
select:focus,
textarea:focus{

outline:none;

border-color:#0b7d43;

box-shadow:

0 0 0 3px rgba(11,125,67,.12);

}

textarea{

resize:vertical;

min-height:110px;

}

/* ==========================
SEARCHABLE DROPDOWN
========================== */

.search-select{

position:relative;

}

.dropdown{

position:absolute;

left:0;

right:0;

top:100%;

background:white;

border:1px solid #ddd;

border-radius:12px;

max-height:240px;

overflow-y:auto;

display:none;

z-index:500;

box-shadow:

0 10px 25px rgba(0,0,0,.08);

}

.dropdown div{

padding:13px 15px;

cursor:pointer;

transition:.2s;

}

.dropdown div:hover{

background:#eef8f1;

}

/* ==========================
BUTTON
========================== */

button{

width:100%;

border:none;

padding:17px;

border-radius:12px;

background:#11a857;

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:.25s;

}

button:hover{

background:#0b7d43;

transform:translateY(-2px);

}

/* ==========================
ERROR
========================== */

.error{

display:none;

margin-top:6px;

color:#dc2626;

font-size:13px;

font-weight:600;

}

/* ==========================
SUCCESS
========================== */

.success{

display:none;

margin-top:20px;

padding:15px;

border-radius:12px;

background:#ecfdf3;

border:1px solid #10b981;

color:#047857;

font-weight:700;

}

/* ==========================
PREVIEW PANEL
========================== */

.preview{

position:sticky;

top:25px;

}

.preview-card{

background:white;

border-radius:22px;

padding:30px;

box-shadow:

0 15px 40px rgba(0,0,0,.08);

}

.preview-card h2{

margin-bottom:25px;

font-size:24px;

color:#0b7d43;

font-weight:800;

}

.preview-row{

display:flex;

justify-content:space-between;

gap:20px;

padding:16px 0;

border-bottom:1px solid #eef2f7;

}

.preview-row:last-child{

border-bottom:none;

}

.preview-label{

color:#6b7280;

font-weight:600;

}

.preview-value{

font-weight:700;

text-align:right;

word-break:break-word;

}

/* ==========================
RESPONSIVE
========================== */

@media(max-width:1000px){

.container{

grid-template-columns:1fr;

}

.preview{

position:static;

}

}

@media(max-width:768px){

body{

padding:14px;

}

.card,
.preview-card{

padding:20px;

border-radius:16px;

}

.grid{

grid-template-columns:1fr;

gap:18px;

}

.header h1{

font-size:24px;

}

button{

padding:15px;

}

}

</style>

</head>

<body>

<div class="container">
    <!-- ==========================
LEFT PANEL
========================== -->

<div class="card">

<div class="header">

<h1>Create Payment Receipt</h1>

<span>Create professional payment receipts for customers worldwide.</span>

</div>

<form id="receiptForm">

<div class="grid">

<!-- Amount -->

<div>

<label>Payment Amount</label>

<input
type="number"
id="amount"
placeholder="0.00"
required>

<div class="error" id="amountError"></div>

</div>

<!-- Currency -->

<div>

<label>Currency</label>

<div class="search-select">

<input
type="text"
id="currencySearch"
placeholder="Search currency..."
autocomplete="off">

<div
class="dropdown"
id="currencyDropdown">

</div>

</div>

<input
type="hidden"
id="currency">

<div
class="error"
id="currencyError">

</div>

</div>

<!-- Payment Method -->

<div>

<label>Payment Method</label>

<div class="search-select">

<input
type="text"
id="paymentMethodSearch"
placeholder="Search payment method..."
autocomplete="off">

<div
class="dropdown"
id="paymentMethodDropdown">

</div>

</div>

<input
type="hidden"
id="paymentMethod">

<div
class="error"
id="paymentMethodError">

</div>

</div>

<!-- Status -->

<div>

<label>Status</label>

<select id="status">

<option>Payment Completed</option>

<option>Payment Pending</option>

<option>Payment Processing</option>

<option>Awaiting Confirmation</option>

<option>Payment Failed</option>

<option>Payment Cancelled</option>

<option>Refunded</option>

<option>On Hold</option>

</select>

</div>

<!-- Receiver -->

<div>

<label>Receiver Name</label>

<input
type="text"
id="receiverName"
placeholder="John Doe">

</div>

<div>

<label>Account Number</label>

<input
type="text"
id="accountNumber"
placeholder="123456789">

</div>

<!-- Transaction -->

<div>

<label>Transaction ID</label>

<input
type="text"
id="transactionID"
placeholder="Generated automatically">

</div>

<div>

<label>Tracking Code</label>

<input
type="text"
id="trackingCode"
placeholder="Generated automatically">

</div>

<!-- Date -->

<div>

<label>Transaction Date</label>

<input
type="datetime-local"
id="transactionDate">

</div>

<!-- Button -->

<div>

<label>Button Destination</label>

<input
type="text"
id="buttonLink"
value="splash.html"
placeholder="splash.html">

</div>

<!-- Action -->

<div class="full">

<label>Action Required</label>

<textarea
id="actionText"
placeholder="Example: Please complete identity verification before funds are released."></textarea>

</div>

<!-- Notes -->

<div class="full">

<label>Internal Notes (Optional)</label>

<textarea
id="notes"
placeholder="Visible only to administrators."></textarea>

</div>

<!-- Save -->

<div class="full">

<button
type="submit"
id="saveReceipt">

Create Receipt

</button>

</div>

<div
class="full">

<div
class="success"
id="messageBox">

</div>

</div>

</div>

</form>

</div>

<!-- ==========================
RIGHT PANEL
========================== -->

<div class="preview">

<div class="preview-card">

<h2>Receipt Preview</h2>

<div class="preview-row">

<div class="preview-label">

Amount

</div>

<div
class="preview-value"
id="previewAmount">

USD 0.00

</div>

</div>

<div class="preview-row">

<div class="preview-label">

Status

</div>

<div
class="preview-value"
id="previewStatus">

Payment Completed

</div>

</div>

<div class="preview-row">

<div class="preview-label">

Receiver

</div>

<div
class="preview-value"
id="previewReceiver">

—

</div>

</div>

<div class="preview-row">

<div class="preview-label">

Payment Method

</div>

<div
class="preview-value"
id="previewMethod">

—

</div>

</div>

<div class="preview-row">

<div class="preview-label">

Tracking Code

</div>

<div
class="preview-value"
id="previewTracking">

—

</div>

</div>

<div class="preview-row">

<div class="preview-label">

Button Destination

</div>

<div
class="preview-value"
id="previewButton">

splash.html

</div>

</div>

</div>

</div>

<script type="module">
    /* =====================================
WORLD CURRENCIES
===================================== */

const currencies = [

"USD - United States Dollar",
"EUR - Euro",
"GBP - British Pound Sterling",
"CAD - Canadian Dollar",
"AUD - Australian Dollar",
"NZD - New Zealand Dollar",
"CHF - Swiss Franc",
"JPY - Japanese Yen",
"CNY - Chinese Yuan",
"HKD - Hong Kong Dollar",
"SGD - Singapore Dollar",
"INR - Indian Rupee",
"PKR - Pakistani Rupee",
"BDT - Bangladeshi Taka",
"NPR - Nepalese Rupee",
"LKR - Sri Lankan Rupee",

"AED - UAE Dirham",
"SAR - Saudi Riyal",
"QAR - Qatari Riyal",
"KWD - Kuwaiti Dinar",
"BHD - Bahraini Dinar",
"OMR - Omani Rial",
"IQD - Iraqi Dinar",
"JOD - Jordanian Dinar",
"ILS - Israeli New Shekel",

"KES - Kenyan Shilling",
"UGX - Ugandan Shilling",
"TZS - Tanzanian Shilling",
"RWF - Rwandan Franc",
"BIF - Burundi Franc",
"ETB - Ethiopian Birr",
"DJF - Djiboutian Franc",
"SOS - Somali Shilling",
"SSP - South Sudanese Pound",
"SDG - Sudanese Pound",
"NGN - Nigerian Naira",
"GHS - Ghanaian Cedi",
"ZAR - South African Rand",
"EGP - Egyptian Pound",
"MAD - Moroccan Dirham",
"DZD - Algerian Dinar",
"TND - Tunisian Dinar",
"XOF - West African CFA Franc",
"XAF - Central African CFA Franc",

"BRL - Brazilian Real",
"ARS - Argentine Peso",
"CLP - Chilean Peso",
"COP - Colombian Peso",
"PEN - Peruvian Sol",
"BOB - Bolivian Boliviano",
"PYG - Paraguayan Guarani",
"UYU - Uruguayan Peso",
"MXN - Mexican Peso",

"RUB - Russian Ruble",
"UAH - Ukrainian Hryvnia",
"TRY - Turkish Lira",

"SEK - Swedish Krona",
"NOK - Norwegian Krone",
"DKK - Danish Krone",
"ISK - Icelandic Krona",
"PLN - Polish Zloty",
"CZK - Czech Koruna",
"HUF - Hungarian Forint",
"RON - Romanian Leu",
"BGN - Bulgarian Lev",
"HRK - Croatian Kuna",

"THB - Thai Baht",
"MYR - Malaysian Ringgit",
"IDR - Indonesian Rupiah",
"PHP - Philippine Peso",
"VND - Vietnamese Dong",
"KRW - South Korean Won",
"TWD - Taiwan Dollar",
"MOP - Macanese Pataca",
"BND - Brunei Dollar",
"LAK - Lao Kip",
"KHR - Cambodian Riel",
"MMK - Myanmar Kyat"

];

/* =====================================
CURRENCY ELEMENTS
===================================== */

const currencySearch =
document.getElementById("currencySearch");

const currencyHidden =
document.getElementById("currency");

const currencyDropdown =
document.getElementById("currencyDropdown");
/* =====================================
WORLDWIDE PAYMENT METHODS
===================================== */

const paymentMethods = [

/* BANK TRANSFERS */

"Bank Transfer",
"Wire Transfer",
"SWIFT Transfer",
"SEPA Transfer",
"ACH Transfer",
"RTGS",
"NEFT",
"IMPS",
"UPI",
"BACS",
"CHAPS",
"FPS",
"NPP",
"PIX",
"Interac e-Transfer",

/* DEBIT & CREDIT CARDS */

"Visa Debit",
"Visa Credit",
"Mastercard Debit",
"Mastercard Credit",
"American Express",
"Discover",
"UnionPay",
"JCB",
"Diners Club",
"Maestro",
"RuPay",

/* DIGITAL WALLETS */

"PayPal",
"Apple Pay",
"Google Pay",
"Samsung Wallet",
"Amazon Pay",

/* USA */

"Cash App",
"Venmo",
"Zelle",

/* AFRICA */

"M-Pesa",
"Airtel Money",
"MTN Mobile Money",
"Orange Money",
"Tigo Pesa",
"Vodafone Cash",
"EcoCash",

/* MONEY TRANSFER */

"Wise",
"Western Union",
"MoneyGram",
"RIA Money Transfer",
"WorldRemit",
"Remitly",
"Paysend",
"Xoom",

/* CRYPTO */

"Bitcoin (BTC)",
"Ethereum (ETH)",
"Tether (USDT)",
"USD Coin (USDC)",
"Binance Pay",
"Coinbase Pay",
"Litecoin",
"Dogecoin",
"Solana",
"XRP",

/* ASIA */

"Alipay",
"WeChat Pay",
"Kakao Pay",
"LINE Pay",
"GCash",
"Maya",
"GrabPay",

/* CASH */

"Cash Deposit",
"Cash Pickup",
"Cheque",
"Money Order",
"Bank Draft",

/* PAYMENT GATEWAYS */

"Stripe",
"Square",
"Adyen",
"Braintree",
"Authorize.Net",
"Payoneer",
"Skrill",
"Neteller",
"Perfect Money",
"Payeer",

"Other"

];


/* =====================================
PAYMENT ELEMENTS
===================================== */

const paymentSearch =
document.getElementById("paymentMethodSearch");

const paymentHidden =
document.getElementById("paymentMethod");

const paymentDropdown =
document.getElementById("paymentMethodDropdown");


/* =====================================
COMMON ELEMENTS
===================================== */

const amount =
document.getElementById("amount");

const receiver =
document.getElementById("receiverName");

const tracking =
document.getElementById("trackingCode");

const status =
document.getElementById("status");

const buttonLink =
document.getElementById("buttonLink");
/* =====================================
SEARCHABLE DROPDOWNS
===================================== */

function buildDropdown(input, hidden, dropdown, data){

    function render(filter=""){

        dropdown.innerHTML="";

        const results=data.filter(item=>

            item.toLowerCase().includes(filter.toLowerCase())

        );

        if(results.length===0){

            dropdown.style.display="none";

            return;

        }

        results.forEach(item=>{

            const option=document.createElement("div");

            option.textContent=item;

            option.onclick=()=>{

                input.value=item;

                hidden.value=item;

                dropdown.style.display="none";

                updatePreview();

            };

            dropdown.appendChild(option);

        });

        dropdown.style.display="block";

    }

    input.addEventListener("focus",()=>{

        render(input.value);

    });

    input.addEventListener("input",()=>{

        render(input.value);

    });

}

/* Build Currency Dropdown */

buildDropdown(

currencySearch,

currencyHidden,

currencyDropdown,

currencies

);

/* Build Payment Dropdown */

buildDropdown(

paymentSearch,

paymentHidden,

paymentDropdown,

paymentMethods

);


/* =====================================
CLOSE DROPDOWNS
===================================== */

document.addEventListener("click",(e)=>{

if(!e.target.closest(".search-select")){

currencyDropdown.style.display="none";

paymentDropdown.style.display="none";

}

});
/* =====================================
FIREBASE IMPORTS
===================================== */

import { db } from "./js/firebase.js";

import {

collection,
addDoc,
serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================
GENERATORS
===================================== */

function generateTrackingCode(){

return "GP"

+

Math.random()

.toString(36)

.substring(2,8)

.toUpperCase()

+

Date.now()

.toString()

.slice(-4);

}


function generateTransactionID(){

return "TXN"

+

Date.now()

+

Math.floor(

Math.random()*900+100

);

}


/* =====================================
DEFAULT VALUES
===================================== */

tracking.value=

generateTrackingCode();

document

.getElementById("transactionID")

.value=

generateTransactionID();


/* =====================================
SUCCESS BOX
===================================== */

const messageBox=

document.getElementById("messageBox");


/* =====================================
SAVE
===================================== */

const form=

document.getElementById("receiptForm");

form.addEventListener(

"submit",

async(e)=>{

e.preventDefault();

messageBox.style.display="none";

const saveBtn=

document.getElementById("saveReceipt");

saveBtn.disabled=true;

saveBtn.textContent=

"Creating Receipt...";

const receipt={

amount:Number(

amount.value

),

currency:

currencyHidden.value,

paymentMethod:

paymentHidden.value,

status:

status.value,

receiverName:

receiver.value.trim(),

accountNumber:

document

.getElementById(

"accountNumber"

).value.trim(),

transactionID:

document

.getElementById(

"transactionID"

).value.trim(),

trackingCode:

tracking.value.trim(),

transactionDate:

document

.getElementById(

"transactionDate"

).value,

actionText:

document

.getElementById(

"actionText"

).value.trim(),

notes:

document

.getElementById(

"notes"

).value.trim(),

buttonLink:

buttonLink.value.trim()

||

"splash.html",

createdAt:

serverTimestamp()

};

try{

await addDoc(

collection(

db,

"receipts"

),

receipt

);
await addDoc(

collection(

db,

"receipts"

),

receipt

);
/* =====================================
SUCCESS
===================================== */

messageBox.style.display = "block";

messageBox.style.background = "#ECFDF3";

messageBox.style.border = "1px solid #10B981";

messageBox.style.color = "#047857";

messageBox.innerHTML = `

<strong>Receipt Created Successfully</strong>

<br><br>

Tracking Code:

<b>${receipt.trackingCode}</b>

<br><br>

Redirecting to receipt...

`;

saveBtn.textContent = "Receipt Created ✓";


setTimeout(()=>{

window.location.href=

"payment_receipt_style.html?tracking="

+

encodeURIComponent(

receipt.trackingCode

);

},1800);

}


/* =====================================
ERROR
===================================== */

catch(error){

console.error(error);

messageBox.style.display="block";

messageBox.style.background="#FEF2F2";

messageBox.style.border="1px solid #EF4444";

messageBox.style.color="#B91C1C";

messageBox.innerHTML=`

<strong>Unable to create receipt.</strong>

<br>

Please check your Firebase configuration and try again.

`;

saveBtn.disabled=false;

saveBtn.textContent="Create Receipt";

}

});
/* =====================================
HELPER BUTTONS
===================================== */

function copyTrackingCode(){

navigator.clipboard.writeText(

tracking.value

);

messageBox.style.display="block";

messageBox.style.background="#ECFDF3";

messageBox.style.border="1px solid #10B981";

messageBox.style.color="#047857";

messageBox.innerHTML=

"<strong>Tracking code copied.</strong>";

}


function resetReceiptForm(){

form.reset();

currencySearch.value="";

currencyHidden.value="";

paymentSearch.value="";

paymentHidden.value="";

tracking.value=

generateTrackingCode();

document

.getElementById("transactionID")

.value=

generateTransactionID();

buttonLink.value="splash.html";

updatePreview();

messageBox.style.display="none";

}


/* =====================================
KEYBOARD SHORTCUT
CTRL + ENTER
===================================== */

document.addEventListener(

"keydown",

(e)=>{

if(

e.ctrlKey &&

e.key==="Enter"

){

e.preventDefault();

form.requestSubmit();

}

}

);


/* =====================================
INITIALIZE
===================================== */

updatePreview();

</script>

</body>

</html>
