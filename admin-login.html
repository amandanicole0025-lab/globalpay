<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalPay Admin Login</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login-box{
            width:350px;
            background:#fff;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 20px rgba(0,0,0,.15);
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#16a34a;
            color:white;
            border:none;
            cursor:pointer;
            border-radius:6px;
            font-size:16px;
        }

        h2{
            text-align:center;
        }

        #error{
            color:red;
            margin-top:10px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn">
Login
</button>

<p id="error"></p>

</div>

<script type="module" src="js/auth.js"></script>

</body>
</html>
