<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Splash Screen</title>
<style>
  :root{
    --bg: #0b4a35;
    --logo: #34e39a;
    --logo-dark: #0b2e22;
    --text-muted: #6f9a89;
    --statusbar-icon: #eafff5;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    background:var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
  }

  .device{
    width:100%;
    max-width:420px;
    height:100vh;
    margin:0 auto;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* Status bar */
  .status-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px 6px;
    color:var(--statusbar-icon);
    font-size:14px;
    font-weight:600;
    flex-shrink:0;
  }
  .status-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .status-time{ font-size:14px; font-weight:600; }
  .status-icons{ display:flex; align-items:center; gap:9px; }
  .status-icons svg{ display:block; }

  .status-right{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .net-speed{
    font-size:10px;
    line-height:1.1;
    text-align:right;
    font-weight:600;
    opacity:0.9;
  }
  .right-icons{
    display:flex;
    align-items:center;
    gap:5px;
  }
  .right-icons svg{ display:block; }

  .battery{
    display:flex;
    align-items:center;
    gap:2px;
  }
  .battery-shell{
    width:23px;
    height:12px;
    border:1.4px solid var(--statusbar-icon);
    border-radius:3px;
    padding:1.5px;
    position:relative;
  }
  .battery-fill{
    height:100%;
    width:71%;
    background:#f2b93e;
    border-radius:1px;
  }
  .battery-tip{
    width:2px;
    height:5px;
    background:var(--statusbar-icon);
    border-radius:0 2px 2px 0;
  }
  .battery-pct{
    font-size:10px;
    font-weight:700;
    margin-right:1px;
  }

  /* Logo center */
  .logo-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo{
    position:relative;
    animation: pop 0.6s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop{
    0%{ transform:scale(0.85); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .logo{ animation:none; }
  }

  /* Footer */
  .footer{
    flex-shrink:0;
    text-align:center;
    padding-bottom:34px;
  }
  .version{
    color:var(--text-muted);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.2px;
    margin-bottom:14px;
  }
  .home-indicator{
    width:112px;
    height:4px;
    background:var(--text-muted);
    opacity:0.6;
    border-radius:3px;
    margin:0 auto;
  }
</style>

<style>img,video{max-width:100%;height:auto}body{max-width:100%;overflow-x:hidden}.container,.card,.wrapper{max-width:100%;width:100%!important}@media(max-width:768px){*{box-sizing:border-box}body{padding:0;margin:0}}</style>
</head>
<body>

<div class="device">

  <div class="logo-wrap">
    <div class="logo">
      <svg width="220" height="200" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">
        <!-- speech bubble body -->
        <path d="
          M50 30
          H160
          C182 30 200 48 200 70
          C200 92 182 110 160 110
          H120
          L120 148
          C120 152 115 154 112 151
          L82 110
          H50
          C28 110 10 92 10 70
          C10 48 28 30 50 30
          Z"
          fill="var(--logo)" />
        <!-- eyes -->
        <circle cx="80" cy="70" r="19" fill="none" stroke="var(--logo-dark)" stroke-width="12"/>
        <circle cx="132" cy="70" r="19" fill="none" stroke="var(--logo-dark)" stroke-width="12"/>
        <!-- comma / apostrophe accent -->
        <path d="M195 45 C193 52 189 58 183 62 C190 63 199 58 201 47 C202 41 198 36 193 37 C190 37.5 189 41 191 43 C192 44 194 44.5 195 45 Z" fill="var(--logo)"/>
      </svg>
    </div>
  </div>

  <div class="footer">
    <div class="version">version: 1.27.0 (435)</div>
    <div class="home-indicator"></div>
  </div>

</div>


<script>
  // Move into the login screen after the splash beat
  setTimeout(function(){
    window.location.href = "login.html";
  }, 1800);
</script>

</body>
</html>
