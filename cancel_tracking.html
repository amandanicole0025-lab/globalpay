<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Cancel Payment</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial,Helvetica,sans-serif;

}

body{

background:#f4f4f4;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

padding:20px;

}

.card{

background:white;

width:100%;

max-width:420px;

padding:30px;

border-radius:12px;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

h1{

text-align:center;

color:#c62828;

margin-bottom:25px;

}

input{

width:100%;

padding:14px;

border:1px solid #ccc;

border-radius:8px;

font-size:16px;

margin-bottom:20px;

}

button{

width:100%;

padding:15px;

background:#d32f2f;

color:white;

border:none;

border-radius:8px;

font-size:18px;

cursor:pointer;

}

button:hover{

background:#b71c1c;

}

</style>

</head>

<body>

<div class="card">

<h1>

Cancel Payment

</h1>

<input

id="trackingCode"

placeholder="Enter Tracking Code">

<button

id="cancelTrackBtn">

Search Payment

</button>

</div>

<script type="module" src="js/cancel_tracking.js"></script>

</body>

</html>
