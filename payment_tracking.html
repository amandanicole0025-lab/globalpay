<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Payment</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#fff;padding:30px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.12);width:380px}
input,button{width:100%;padding:12px;margin-top:12px}
button{background:#11834b;color:#fff;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>Track Your Payment</h2>
<input id="trackingCode" placeholder="Enter Tracking Code">
<button id="trackBtn">Track Payment</button>
</div>
<script type="module" src="js/tracking.js"></script>
</body>
</html>
